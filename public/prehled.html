<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Přehled výsledků</title>
<link rel="stylesheet" href="css/prehled.css">
</head>
<body>
<main class="ph">
  <h1>Přehled výsledků</h1>

  <form id="phGate" class="ph-card ph-gate" autocomplete="off">
    <label for="phPass">Heslo k přehledu</label>
    <input id="phPass" type="password" autocomplete="current-password">
    <button type="submit">Otevřít</button>
    <p id="phError" class="ph-error" hidden></p>
  </form>

  <section id="phPanel" hidden>
    <div class="ph-filters">
      <label>Období
        <select id="phDays">
          <option value="7">7 dní</option>
          <option value="30" selected>30 dní</option>
          <option value="90">90 dní</option>
          <option value="365">rok</option>
        </select>
      </label>
      <button id="phReload" type="button">Načíst znovu</button>
      <button id="phClear" type="button" class="ph-ghost">Zrušit filtry</button>
    </div>
    <div id="phSummary" class="ph-card ph-summary"></div>
    <div class="ph-table-wrap">
      <table id="phTable" class="ph-table">
        <thead>
          <tr id="phHead"></tr>
          <tr id="phFilter" class="ph-filter-row"></tr>
        </thead>
        <tbody id="phBody"></tbody>
      </table>
    </div>
  </section>
</main>
<script type="module" src="js/prehled.js"></script>
</body>
</html>
